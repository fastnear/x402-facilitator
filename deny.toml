[advisories]
ignore = [
  # rust_decimal still lists optional rkyv 0.7 metadata in Cargo.lock, but rkyv
  # is not reachable from normal/build dependencies. scripts/check.sh refuses
  # this exception if the edge becomes active.
  "RUSTSEC-2026-0235",
  # The fixed rustls (>= 0.23.46) and rustls-webpki (>= 0.103.16) need
  # aws-lc-rs ^1.18, but near-crypto pins aws-lc-rs =1.16.2. scripts/check.sh
  # refuses these exceptions as soon as the resolver selects any other
  # aws-lc-rs version.
  "RUSTSEC-2026-0285",
  "RUSTSEC-2026-0346",
  "RUSTSEC-2026-0348",
  "RUSTSEC-2026-0349",
  "RUSTSEC-2026-0382",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
