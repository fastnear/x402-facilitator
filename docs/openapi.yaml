openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: x402 exact-payment facilitator for NEAR and Base
  version: 0.5.0
  description: |
    Authenticated x402 facilitator for exact Circle USDC payments on NEAR and
    Base. Each process is pinned to one network and one canonical asset.

    x402 v2 is canonical. The v2 request is a strict union: NEAR carries a
    standard-base64 Borsh classic NEP-366 SignedDelegateAction; EVM carries an
    ERC-3009 authorization and payer signature. Unknown fields are rejected at
    every parsed level outside the explicitly extensible `extra`, `extensions`,
    and extension-schema maps.

    An EVM instance may enable the off-by-default `accept_v1` gate. Such an
    instance also accepts the legacy v1 request branch documented here for
    network aliases `base` and `base-sepolia`. It translates that branch to
    canonical v2 before policy, verification, fingerprinting, or settlement.
    NEAR instances never accept or advertise v1.

    Expected payment rejection is an HTTP 200 protocol response. Malformed
    transport, authentication, policy quota, identifier conflict, and
    unavailable or indeterminate infrastructure use HTTP errors.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: FastNEAR x402 facilitator maintainers
    url: https://github.com/fastnear/x402-near-facilitator
servers:
  - url: https://{host}
    description: Replace the reserved default with one facilitator instance
    variables:
      host:
        default: facilitator.invalid
        description: Hostname of a process pinned to one supported network
tags:
  - name: Discovery
    description: Public facilitator capabilities
  - name: Facilitator
    description: Authenticated payment verification and settlement
  - name: Operations
    description: Public sanitized liveness and readiness
paths:
  /:
    get:
      tags: [Discovery]
      operationId: getLandingPage
      summary: Identify the facilitator and link its public operator surfaces
      security: []
      responses:
        "200":
          description: Human-readable facilitator landing page
          content:
            text/html:
              schema:
                type: string
  /supported:
    get:
      tags: [Discovery]
      operationId: getSupported
      summary: Report this instance's payment kinds, extensions, and signer
      security: []
      responses:
        "200":
          description: |
            A v2-only instance returns one kind. An EVM instance with
            `accept_v1` returns the canonical v2 kind and its legacy v1 alias.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportedResponse"
        "503":
          $ref: "#/components/responses/Unavailable"
  /verify:
    post:
      tags: [Facilitator]
      operationId: verifyPayment
      summary: Verify a payment authorization without broadcasting
      description: |
        Authentication occurs before body parsing. The legacy request branch is
        accepted only on an EVM instance whose operator enabled `accept_v1`.
      security:
        - ApiKey: []
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilitatorRequest"
      responses:
        "200":
          description: Definitive valid or invalid x402 verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateOrBudgetLimit"
        "503":
          $ref: "#/components/responses/Unavailable"
  /settle:
    post:
      tags: [Facilitator]
      operationId: settlePayment
      summary: Claim, reverify, and settle a payment exactly once
      description: |
        The service claims the durable settlement, verifies again, persists the
        exact signed submission bytes and hash, and broadcasts at most that
        submission. NEAR terminal success requires the unique inner NEP-141
        receipt to finish with SuccessValue. EVM terminal success requires the
        configured confirmation depth; a mined-then-missing transaction returns
        to nonterminal reconciliation.
      security:
        - ApiKey: []
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilitatorRequest"
      responses:
        "200":
          description: Definitive x402 settlement result in the request's wire dialect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateOrBudgetLimit"
        "503":
          $ref: "#/components/responses/Unavailable"
  /healthz:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Report process liveness and build version
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Report sanitized settlement readiness
      security: []
      responses:
        "200":
          description: Instance can safely accept settlement work
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Instance is alive but cannot safely settle
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Primary resource-server credential. If a Bearer credential is also
        present, both values must be identical.
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: x402 API key
      description: |
        Alternative resource-server credential. If X-API-Key is also present,
        both values must be identical.
  headers:
    RetryAfter:
      description: Suggested retry delay in seconds
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Malformed JSON, strict-shape failure, or invalid payment-identifier syntax
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, invalid, revoked, or conflicting dual credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Payment identifier is already bound to another canonical fingerprint
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooLarge:
      description: JSON body exceeds 65,536 bytes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Content-Type is not application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateOrBudgetLimit:
      description: API-client request rate or sponsorship budget is exhausted
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: |
        Database, leadership, startup reconciliation, RPC, signer, or
        indeterminate chain evidence prevents a safe answer
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    NearNetwork:
      type: string
      enum: [near:testnet, near:mainnet]
    EvmNetwork:
      type: string
      enum: ["eip155:84532", "eip155:8453"]
    CanonicalNetwork:
      oneOf:
        - $ref: "#/components/schemas/NearNetwork"
        - $ref: "#/components/schemas/EvmNetwork"
    LegacyEvmNetwork:
      type: string
      enum: [base-sepolia, base]
    DecimalAtomicAmount:
      type: string
      pattern: "^[0-9]+$"
      description: Unsigned base-10 integer in the asset's atomic units
    EvmAddress:
      type: string
      pattern: "^0x[0-9A-Fa-f]{40}$"
    Bytes32:
      type: string
      pattern: "^0x[0-9A-Fa-f]{64}$"
    HexBytes:
      type: string
      pattern: "^0x(?:[0-9A-Fa-f]{2})+$"
    ResourceInfo:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        description:
          type: string
        mimeType:
          type: string
        serviceName:
          type: string
        tags:
          type: array
          items:
            type: string
        iconUrl:
          type: string
          format: uri
    PaymentIdentifierExtension:
      type: object
      required: [info, schema]
      additionalProperties: false
      properties:
        info:
          type: object
          required: [required]
          additionalProperties: false
          properties:
            required:
              type: boolean
            id:
              type: string
              minLength: 16
              maxLength: 128
              pattern: "^[A-Za-z0-9_-]+$"
        schema:
          type: object
          additionalProperties: true
    PaymentExtensions:
      type: object
      description: |
        Extension envelope. `payment-identifier`, when present, is validated
        strictly; other canonical x402 extension entries are preserved.
      additionalProperties: true
      properties:
        payment-identifier:
          $ref: "#/components/schemas/PaymentIdentifierExtension"
    NearPaymentRequirements:
      type: object
      required: [scheme, network, asset, amount, payTo, maxTimeoutSeconds]
      additionalProperties: false
      properties:
        scheme:
          type: string
          const: exact
        network:
          $ref: "#/components/schemas/NearNetwork"
        asset:
          type: string
          minLength: 2
          description: Configured canonical Circle NEP-141 contract account ID
        amount:
          $ref: "#/components/schemas/DecimalAtomicAmount"
        payTo:
          type: string
          minLength: 2
          description: Exact NEAR recipient account ID
        maxTimeoutSeconds:
          type: integer
          minimum: 1
        extra:
          type: object
          additionalProperties: true
    Eip712Domain:
      type: object
      required: [name, version]
      additionalProperties: true
      properties:
        name:
          type: string
          minLength: 1
          description: Real token EIP-712 domain name; Base mainnet USDC uses USD Coin
        version:
          type: string
          minLength: 1
          description: Real token EIP-712 domain version; Base USDC uses 2
    EvmPaymentRequirements:
      type: object
      required: [scheme, network, asset, amount, payTo, maxTimeoutSeconds, extra]
      additionalProperties: false
      properties:
        scheme:
          type: string
          const: exact
        network:
          $ref: "#/components/schemas/EvmNetwork"
        asset:
          $ref: "#/components/schemas/EvmAddress"
        amount:
          $ref: "#/components/schemas/DecimalAtomicAmount"
        payTo:
          $ref: "#/components/schemas/EvmAddress"
        maxTimeoutSeconds:
          type: integer
          minimum: 1
        extra:
          $ref: "#/components/schemas/Eip712Domain"
    NearMechanismPayload:
      type: object
      required: [signedDelegateAction]
      additionalProperties: false
      properties:
        signedDelegateAction:
          type: string
          minLength: 1
          contentEncoding: base64
          description: Standard-base64 Borsh classic NEP-366 SignedDelegateAction
    Erc3009Authorization:
      type: object
      required: [from, to, value, validAfter, validBefore, nonce]
      additionalProperties: false
      properties:
        from:
          $ref: "#/components/schemas/EvmAddress"
        to:
          $ref: "#/components/schemas/EvmAddress"
        value:
          $ref: "#/components/schemas/DecimalAtomicAmount"
        validAfter:
          $ref: "#/components/schemas/DecimalAtomicAmount"
        validBefore:
          $ref: "#/components/schemas/DecimalAtomicAmount"
        nonce:
          $ref: "#/components/schemas/Bytes32"
    EvmMechanismPayload:
      type: object
      required: [authorization, signature]
      additionalProperties: false
      properties:
        authorization:
          $ref: "#/components/schemas/Erc3009Authorization"
        signature:
          $ref: "#/components/schemas/HexBytes"
          description: EOA or supported deployed smart-wallet payer signature
    NearPaymentPayloadV2:
      type: object
      required: [x402Version, accepted, payload]
      additionalProperties: false
      properties:
        x402Version:
          type: integer
          const: 2
        resource:
          $ref: "#/components/schemas/ResourceInfo"
        accepted:
          $ref: "#/components/schemas/NearPaymentRequirements"
        payload:
          $ref: "#/components/schemas/NearMechanismPayload"
        extensions:
          $ref: "#/components/schemas/PaymentExtensions"
    EvmPaymentPayloadV2:
      type: object
      required: [x402Version, accepted, payload]
      additionalProperties: false
      properties:
        x402Version:
          type: integer
          const: 2
        resource:
          $ref: "#/components/schemas/ResourceInfo"
        accepted:
          $ref: "#/components/schemas/EvmPaymentRequirements"
        payload:
          $ref: "#/components/schemas/EvmMechanismPayload"
        extensions:
          $ref: "#/components/schemas/PaymentExtensions"
    NearFacilitatorRequestV2:
      type: object
      required: [x402Version, paymentPayload, paymentRequirements]
      additionalProperties: false
      properties:
        x402Version:
          type: integer
          const: 2
        paymentPayload:
          $ref: "#/components/schemas/NearPaymentPayloadV2"
        paymentRequirements:
          $ref: "#/components/schemas/NearPaymentRequirements"
    EvmFacilitatorRequestV2:
      type: object
      required: [x402Version, paymentPayload, paymentRequirements]
      additionalProperties: false
      properties:
        x402Version:
          type: integer
          const: 2
        paymentPayload:
          $ref: "#/components/schemas/EvmPaymentPayloadV2"
        paymentRequirements:
          $ref: "#/components/schemas/EvmPaymentRequirements"
    LegacyEvmPaymentRequirements:
      type: object
      required:
        - scheme
        - network
        - maxAmountRequired
        - payTo
        - maxTimeoutSeconds
        - asset
        - extra
      additionalProperties: false
      properties:
        scheme:
          type: string
          const: exact
        network:
          $ref: "#/components/schemas/LegacyEvmNetwork"
        maxAmountRequired:
          $ref: "#/components/schemas/DecimalAtomicAmount"
        resource:
          type: string
          format: uri
        description:
          type: string
        mimeType:
          type: string
        outputSchema: {}
        payTo:
          $ref: "#/components/schemas/EvmAddress"
        maxTimeoutSeconds:
          type: integer
          minimum: 1
        asset:
          $ref: "#/components/schemas/EvmAddress"
        extra:
          $ref: "#/components/schemas/Eip712Domain"
    LegacyEvmPaymentPayloadV1:
      type: object
      required: [x402Version, scheme, network, payload]
      additionalProperties: false
      properties:
        x402Version:
          type: integer
          const: 1
        scheme:
          type: string
          const: exact
        network:
          $ref: "#/components/schemas/LegacyEvmNetwork"
        payload:
          $ref: "#/components/schemas/EvmMechanismPayload"
    LegacyEvmFacilitatorRequestV1:
      type: object
      description: |
        Accepted only when `accept_v1` is enabled on an EVM instance. The
        payload and requirements scheme/network values must agree.
      required: [x402Version, paymentPayload, paymentRequirements]
      additionalProperties: false
      properties:
        x402Version:
          type: integer
          const: 1
        paymentPayload:
          $ref: "#/components/schemas/LegacyEvmPaymentPayloadV1"
        paymentRequirements:
          $ref: "#/components/schemas/LegacyEvmPaymentRequirements"
    FacilitatorRequestV2:
      oneOf:
        - $ref: "#/components/schemas/NearFacilitatorRequestV2"
        - $ref: "#/components/schemas/EvmFacilitatorRequestV2"
    FacilitatorRequest:
      oneOf:
        - $ref: "#/components/schemas/FacilitatorRequestV2"
        - $ref: "#/components/schemas/LegacyEvmFacilitatorRequestV1"
    VerifyResponse:
      type: object
      required: [isValid]
      additionalProperties: false
      properties:
        isValid:
          type: boolean
        invalidReason:
          type: string
        invalidMessage:
          type: string
        payer:
          type: string
          description: Present only after authoritative signature verification
        extensions:
          type: object
          additionalProperties: true
    SettleResponseV2:
      type: object
      required: [success, transaction, network]
      additionalProperties: false
      properties:
        success:
          type: boolean
        errorReason:
          type: string
        errorMessage:
          type: string
        payer:
          type: string
        transaction:
          type: string
          description: Chain transaction hash, or an empty string before broadcast
        network:
          $ref: "#/components/schemas/CanonicalNetwork"
        extensions:
          type: object
          additionalProperties: true
    SettleResponseV1:
      type: object
      required: [success, transaction, network]
      additionalProperties: false
      properties:
        success:
          type: boolean
        errorReason:
          type: string
        errorMessage:
          type: string
        payer:
          type: string
        transaction:
          type: string
        network:
          $ref: "#/components/schemas/LegacyEvmNetwork"
        extensions:
          type: object
          additionalProperties: true
    SettleResponse:
      oneOf:
        - $ref: "#/components/schemas/SettleResponseV2"
        - $ref: "#/components/schemas/SettleResponseV1"
    SupportedKindV2:
      type: object
      required: [x402Version, scheme, network]
      additionalProperties: false
      properties:
        x402Version:
          type: integer
          const: 2
        scheme:
          type: string
          const: exact
        network:
          $ref: "#/components/schemas/CanonicalNetwork"
        extra:
          type: object
          additionalProperties: true
    SupportedKindV1:
      type: object
      required: [x402Version, scheme, network]
      additionalProperties: false
      properties:
        x402Version:
          type: integer
          const: 1
        scheme:
          type: string
          const: exact
        network:
          $ref: "#/components/schemas/LegacyEvmNetwork"
        extra:
          type: object
          additionalProperties: true
    SupportedResponse:
      type: object
      required: [kinds, extensions, signers]
      additionalProperties: false
      properties:
        kinds:
          type: array
          minItems: 1
          maxItems: 2
          items:
            oneOf:
              - $ref: "#/components/schemas/SupportedKindV2"
              - $ref: "#/components/schemas/SupportedKindV1"
        extensions:
          type: array
          contains:
            const: payment-identifier
          items:
            type: string
        signers:
          type: object
          description: Canonical CAIP-2 network ID to facilitator signer identities
          minProperties: 1
          additionalProperties:
            type: array
            minItems: 1
            items:
              type: string
    HealthResponse:
      type: object
      required: [status, service, version]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: x402-near-facilitator
          description: Historical compatibility identifier
        version:
          type: string
    ReadinessCheck:
      type: string
      enum: [ready, not_ready]
    ReadinessResponse:
      type: object
      required: [ready, checks]
      additionalProperties: false
      properties:
        ready:
          type: boolean
        checks:
          type: object
          required: [database, leadership, reconciliation, rpc, relayer]
          additionalProperties: false
          properties:
            database:
              $ref: "#/components/schemas/ReadinessCheck"
            leadership:
              $ref: "#/components/schemas/ReadinessCheck"
            reconciliation:
              $ref: "#/components/schemas/ReadinessCheck"
            rpc:
              $ref: "#/components/schemas/ReadinessCheck"
            relayer:
              $ref: "#/components/schemas/ReadinessCheck"
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
