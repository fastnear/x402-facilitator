version: 2
updates:
  # Every cargo PR must update both lockfiles: the fuzz workspace resolves the
  # same path crates and exact NEAR pins as the production workspace, so a PR
  # that changes a manifest requirement but only one lockfile fails
  # `cargo metadata --locked` in scripts/check.sh (#203-#205 after #196).
  # Only `group-by: dependency-name` makes Dependabot span the listed
  # directories in one PR; a plain group still opens one PR per directory.
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust:
        group-by: dependency-name
  - package-ecosystem: npm
    directory: /crates/x402-chain-near/fixtures
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /conformance/http-client
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /examples/resource-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /examples/merchant-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
