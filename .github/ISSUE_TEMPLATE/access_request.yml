name: Reference-instance access
description: Request bounded access to a public NEAR or Base facilitator
title: "access: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Never include an API key, private key, signed
        payment authorization, credentialed URL, raw transaction bytes, or
        other bearer instrument. Approval is not guaranteed and the reference
        service has no availability SLA.

  - type: checkboxes
    id: networks
    attributes:
      label: Active reference networks
      description: Select only networks the integration will use now. Base mainnet uses Circle USDC's `USD Coin` / `2` EIP-712 domain.
      options:
        - label: near:testnet
        - label: near:mainnet
        - label: eip155:8453 (Base mainnet)
    validations:
      required: true

  - type: dropdown
    id: base_sepolia_interest
    attributes:
      label: Base Sepolia interest
      description: Base Sepolia is not a live reference instance; this records rollout interest only.
      options:
        - No Base Sepolia access needed
        - Notify me if a Base Sepolia reference instance becomes available
    validations:
      required: true

  - type: textarea
    id: project
    attributes:
      label: Integration
      description: Describe the resource server, who operates it, and its intended users.
    validations:
      required: true

  - type: input
    id: public_url
    attributes:
      label: Public resource-server URL or documentation
      description: Link the independently operated HTTPS service, public source, or integration documentation.
      placeholder: https://merchant.example/x402
    validations:
      required: true

  - type: textarea
    id: recipients
    attributes:
      label: Exact USDC recipients
      description: Map each active network to a public recipient account or address controlled by the resource-server operator. Wildcards are not supported.
    validations:
      required: true

  - type: textarea
    id: usage
    attributes:
      label: Expected usage
      description: Give the verify/settle rate, daily settlement count, evaluation duration, and expected atomic USDC amount range.
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Wire transport
      options:
        - Canonical x402 v2
        - Canonical v2 plus gated EVM v1 compatibility
    validations:
      required: true

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgements
      options:
        - label: This issue contains no secret or signed payment authorization.
          required: true
        - label: Each deployed resource-server instance and environment will use its own credential.
          required: true
        - label: I control, or am authorized to use, every listed recipient.
          required: true
        - label: I understand access is exact-policy, bounded, revocable, and has no SLA.
          required: true
        - label: I will complete read-only verification before settlement is enabled and will not ask the facilitator operator to fund payer wallets or manufacture activity.
          required: true
