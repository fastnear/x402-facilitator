# Base (eip155:8453) demo x402 resource workload: the packaged example
# resource server from examples/resource-server, deployed against the Base
# facilitator (base.x402.mikedotexe.com). Nginx terminates public TLS
# directly. Add x402-demo-base.mikedotexe.com to a certificate lineage before
# enabling this site. Unknown hostnames are refused by the default-server
# blocks in x402-near-facilitator.conf, so that site must stay enabled too.

upstream x402_demo_base {
    server 127.0.0.1:4023;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name x402-demo-base.mikedotexe.com;

    location /.well-known/acme-challenge/ {
        root /var/www/x402-near-acme;
        default_type text/plain;
    }

    location / {
        return 308 https://x402-demo-base.mikedotexe.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name x402-demo-base.mikedotexe.com;

    ssl_certificate /etc/letsencrypt/live/x402-demo-base.mikedotexe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/x402-demo-base.mikedotexe.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:x402_demo_base_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    access_log /var/log/nginx/x402-demo-base.access.log combined;
    error_log /var/log/nginx/x402-demo-base.error.log warn;
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /work {
        limit_except POST { deny all; }
        proxy_pass http://x402_demo_base;
        proxy_read_timeout 70s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # x402scan discovery documents (static; see deploy/demo/discovery/).
    location = /favicon.ico {
        limit_except GET { deny all; }
        default_type image/x-icon;
        alias /var/www/x402-demo/favicon.ico;
    }

    location = /openapi.json {
        limit_except GET { deny all; }
        default_type application/json;
        alias /var/www/x402-demo/base/openapi.json;
    }

    location = /.well-known/x402 {
        limit_except GET { deny all; }
        default_type application/json;
        alias /var/www/x402-demo/base/well-known-x402.json;
    }

    location / {
        return 404;
    }
}
