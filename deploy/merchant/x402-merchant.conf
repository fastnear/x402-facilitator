# Agent-facing merchant API. Each hostname is one network-specific process.
# DNS and the certificate must be installed before enabling the HTTPS blocks.
# Both TLS servers use the merchant-near lineage, whose certificate must carry
# SANs for merchant-near.mikedotexe.com and merchant-base.mikedotexe.com.

upstream x402_merchant_near {
    server 127.0.0.1:4034;
    keepalive 8;
}

upstream x402_merchant_base {
    server 127.0.0.1:4035;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name merchant-near.mikedotexe.com merchant-base.mikedotexe.com;

    location /.well-known/acme-challenge/ {
        root /var/www/x402-near-acme;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name merchant-near.mikedotexe.com;

    ssl_certificate /etc/letsencrypt/live/merchant-near.mikedotexe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/merchant-near.mikedotexe.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:x402_merchant_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    access_log /var/log/nginx/x402-merchant-near.access.log combined;
    error_log /var/log/nginx/x402-merchant-near.error.log warn;
    client_max_body_size 32k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Link "</openapi.json>; rel=\"service-desc\"" always;

    location / {
        proxy_pass http://x402_merchant_near;
        proxy_read_timeout 30s;
        # PAYMENT-REQUIRED carries Bazaar JSON schemas and can exceed nginx's
        # platform-default single-page upstream header buffer.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name merchant-base.mikedotexe.com;

    ssl_certificate /etc/letsencrypt/live/merchant-near.mikedotexe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/merchant-near.mikedotexe.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:x402_merchant_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    access_log /var/log/nginx/x402-merchant-base.access.log combined;
    error_log /var/log/nginx/x402-merchant-base.error.log warn;
    client_max_body_size 32k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Link "</openapi.json>; rel=\"service-desc\"" always;

    location / {
        proxy_pass http://x402_merchant_base;
        proxy_read_timeout 30s;
        # Keep parity with the NEAR origin for schema-rich x402 challenges.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
