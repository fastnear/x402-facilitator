# EVM (Base Sepolia) facilitator virtual host.
#
# Installed alongside the NEAR site (deploy/nginx/x402-near-facilitator.conf)
# on the same host; it adds only the base-test.x402.mikedotexe.com name and
# its :8404 upstream. It deliberately declares no `default_server`: the NEAR
# site owns the deny-by-default catch-all for unknown Host/SNI on 80/443, so
# both files must be enabled together (two default_server blocks on one
# listen address would fail `nginx -t`). On an EVM-only host, copy the NEAR
# site's default_server blocks here instead.
#
# base-test.x402.mikedotexe.com must be added to the existing
# /etc/letsencrypt/live/x402.mikedotexe.com lineage (certbot --expand) before
# this site is enabled; until then SNI for this name presents a certificate
# without a matching SAN.

upstream x402_base_sepolia {
    server 127.0.0.1:8404;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name base-test.x402.mikedotexe.com;

    # ACME HTTP-01 renewals share the NEAR site's webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/x402-near-acme;
        default_type text/plain;
    }

    location / {
        return 308 https://base-test.x402.mikedotexe.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name base-test.x402.mikedotexe.com;

    ssl_certificate /etc/letsencrypt/live/x402.mikedotexe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/x402.mikedotexe.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:x402_near_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    access_log /var/log/nginx/x402-near-facilitator.access.log combined;
    error_log /var/log/nginx/x402-near-facilitator.error.log warn;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    error_page 413 = @base_sepolia_payload_too_large;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location @base_sepolia_payload_too_large {
        internal;
        default_type application/json;
        return 413 '{"error":{"code":"request_too_large","message":"request body exceeds 64 KiB"}}';
    }

    location = /settle {
        limit_except POST { deny all; }
        proxy_pass http://x402_base_sepolia;
        proxy_read_timeout 65s;
        include /etc/nginx/snippets/x402-near-proxy.conf;
    }

    location = /verify {
        limit_except POST { deny all; }
        proxy_pass http://x402_base_sepolia;
        proxy_read_timeout 20s;
        include /etc/nginx/snippets/x402-near-proxy.conf;
    }

    location ~ ^/(supported|healthz|readyz)$ {
        limit_except GET { deny all; }
        proxy_pass http://x402_base_sepolia;
        proxy_read_timeout 10s;
        include /etc/nginx/snippets/x402-near-proxy.conf;
    }

    location / {
        return 404;
    }
}
